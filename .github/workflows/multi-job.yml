
name: Multi-Job Workflow

on: [push]
jobs:
    ubuntu:
        name: Ubuntu Job
        runs-on: ubuntu-latest
        steps:
          - name: Checkout the code
            uses: actions/checkout@v4

          - name: Set up Go environment
            uses: actions/setup-go@v5.5
            with:
                go-version: "1.20"

          - name: Compile the Go file
            run: go build -o main main.go

          - name: Run the compiled binary
            run: ./main

    windows:
        name: Windows Job
        runs-on: windows-latest
        steps:
          - name: Checkout the code
            uses: actions/checkout@v4

          - name: Set up Go environment
            uses: actions/setup-go@v5.5
            with:
                go-version: "1.20"

          - name: Compile the Go file
            run: go build -o main main.go

          - name: Run the compiled binary
            run: .\main

    macos:
        name: Mac-OS Job
        runs-on: macos-latest
        steps:
          - name: Checkout the code
            uses: actions/checkout@v4

          - name: Set up Go environment
            uses: actions/setup-go@v5.5
            with:
                go-version: "1.20"

          - name: Compile the Go file
            run: go build -o main main.go

          - name: Run the compiled binary
            run: ./main

    cross-compile:
        name: Cross-Compile Job
        runs-on: ubuntu-latest
        needs: [ubuntu, windows, macos]
        steps:
          - name: Checkout the code
            uses: actions/checkout@v4

          - name: Set up Go environment
            uses: actions/setup-go@v5.5
            with:
                go-version: "1.20"

          - name: Cross compile for all platforms
            run: |
                echo "Cross compiling for all platforms:"
                GOOS=linux GOARCH=amd64 go build -o main-linux main.go
                GOOS=windows GOARCH=amd64 go build -o main-windows.exe main.go
                GOOS=darwin GOARCH=amd64 go build -o main-macos-intel main.go
